<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>andrei1810 — Virtual Scroll Cube</title>
  <style>
    :root{
      --bg:#0b0f15;
      --hue:210;
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;overflow:hidden;background:linear-gradient(180deg,#071021 0%,var(--bg) 60%);font-family:Inter,ui-sans-serif,system-ui,Segoe UI,Roboto,'Helvetica Neue',Arial}
    .site{
      height:100%;display:grid;grid-template-columns: 260px 1fr;gap:24px;align-items:center;padding:48px;
    }
    .sidebar{
      display:flex;flex-direction:column;gap:18px;padding:20px;border-radius:16px;background:rgba(255,255,255,0.02);backdrop-filter: blur(6px);
      box-shadow: 0 6px 30px rgba(2,6,23,0.6), inset 0 1px 0 rgba(255,255,255,0.02);
    }
    .logo{color: white;font-weight:700;font-size:28px;letter-spacing:1px;display:flex;align-items:center;gap:12px;}
    .logo .dot{width:12px;height:12px;border-radius:4px;background:linear-gradient(135deg,hsl(var(--hue) 90% 60%), hsl(calc(var(--hue) + 60) 90% 60%));}
    .sidebar p{color:rgba(255,255,255,0.6);margin:0;font-size:13px}
    .main{display:flex;align-items:center;justify-content:center;}
    .stage{width:360px;height:360px;display:grid;place-items:center;perspective:1100px;}
    .cube-wrap{width:220px;height:220px;transform-style:preserve-3d;}
    .cube{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform 0.25s ease-out;}
    .face{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:700;color:rgba(0,0,0,0.12);font-size:22px;border-radius:8px;background: linear-gradient(180deg, hsl(var(--hue) 85% 58%), hsl(calc(var(--hue) + 18) 85% 48%));box-shadow: 0 10px 30px rgba(2,10,25,0.6), inset 0 1px 0 rgba(255,255,255,0.12);}
    .face--front  { transform: translateZ(110px); }
    .face--back   { transform: rotateY(180deg) translateZ(110px); }
    .face--right  { transform: rotateY(90deg) translateZ(110px); }
    .face--left   { transform: rotateY(-90deg) translateZ(110px); }
    .face--top    { transform: rotateX(90deg) translateZ(110px); }
    .face--bottom { transform: rotateX(-90deg) translateZ(110px); }
  </style>
</head>
<body>
  <div class="site">
    <aside class="sidebar">
      <div class="logo"><div class="dot"></div><div>andrei1810</div></div>
      <p>Use your mouse wheel or swipe to rotate the cube. The cube's color changes based on virtual scroll.</p>
    </aside>
    <main class="main">
      <div class="stage">
        <div class="cube-wrap" id="cubeWrap">
          <div class="cube" id="cube">
            <div class="face face--front">FRONT</div>
            <div class="face face--back">BACK</div>
            <div class="face face--right">RIGHT</div>
            <div class="face face--left">LEFT</div>
            <div class="face face--top">TOP</div>
            <div class="face face--bottom">BOT</div>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script>
    const cube = document.getElementById('cube');
    const root = document.documentElement;
    const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
    let virtualScroll = 0, targetRotX = 0, targetRotY = 0, targetHue = 210;
    let curRotX = 0, curRotY = 0, curHue = 210;

    function updateTargets(){
      targetRotX = virtualScroll * 720;
      targetRotY = virtualScroll * 1080;
      targetHue = Math.round(virtualScroll * 360);
    }

    function loop(){
      const ease = 0.12;
      curRotX += (targetRotX - curRotX) * ease;
      curRotY += (targetRotY - curRotY) * ease;
      curHue  += (targetHue - curHue) * ease;
      cube.style.transform = `rotateX(${curRotX}deg) rotateY(${curRotY}deg)`;
      root.style.setProperty('--hue', Math.floor(curHue));
      requestAnimationFrame(loop);
    }

    window.addEventListener('wheel', e => {
      virtualScroll += e.deltaY * 0.001;
      virtualScroll = clamp(virtualScroll, 0, 1);
      updateTargets();
    });

    let touchStartY = 0;
    window.addEventListener('touchstart', e => {
      touchStartY = e.touches[0].clientY;
    });
    window.addEventListener('touchmove', e => {
      let dy = touchStartY - e.touches[0].clientY;
      virtualScroll += dy * 0.002;
      virtualScroll = clamp(virtualScroll, 0, 1);
      updateTargets();
      touchStartY = e.touches[0].clientY;
    });

    updateTargets();
    loop();
  </script>
</body>
</html>
